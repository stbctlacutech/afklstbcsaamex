<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff" id="themeColor">
<title>WT Helper</title>
<style>
  :root{
    --bg:#faf8f5;
    --text:#2d2d3a;
    --header-bg:#fff;
    --header-border:#e8e4df;
    --chat-bg:#faf8f5;
    --bubble-bot-bg:#fff;
    --bubble-bot-border:#e8e4df;
    --bubble-bot-text:#2d2d3a;
    --bubble-user-bg:linear-gradient(135deg,#ff6b6b 0%,#ff8e53 100%);
    --bubble-user-text:#fff;
    --input-bg:#fff;
    --input-border:#e8e4df;
    --placeholder:#a09890;
    --chip-bg:#f5f0eb;
    --chip-border:#e8e4df;
    --chip-text:#2d2d3a;
    --typing-bg:#d5cec7;
    --shadow:0 2px 8px rgba(0,0,0,0.06);
    --menu-ahl-bg:#e8f8f0;--menu-ahl-text:#27ae60;
    --menu-dpr-bg:#ffebee;--menu-dpr-text:#e74c3c;
    --menu-ohd-bg:#fff5e6;--menu-ohd-text:#f39c12;
    --menu-rush-bg:#e3f2fd;--menu-rush-text:#1e90ff;
    --menu-afkl-bg:#f3e5f5;--menu-afkl-text:#9c27b0;
    --menu-mx-bg:#fff3e0;--menu-mx-text:#ff8f00;
    --menu-system-bg:#eceff1;--menu-system-text:#546e7a;
    --menu-general-bg:#f5f0eb;--menu-general-text:#6d635b;
    --menu-codes-bg:#fff;--menu-codes-text:#2d2d3a;
    --accent:#ff6b6b;
    --accent-hover:#ff5252;
    --divider:#e8e4df;
    --scroll-thumb:#d5cec7;
  }
  .dark{
    --bg:#0f0f1a;
    --text:#e8e8f0;
    --header-bg:#16162a;
    --header-border:#2a2a45;
    --chat-bg:#0f0f1a;
    --bubble-bot-bg:#1e1e2f;
    --bubble-bot-border:#2a2a45;
    --bubble-bot-text:#e8e8f0;
    --bubble-user-bg:linear-gradient(135deg,#ff6b6b 0%,#ff8e53 100%);
    --bubble-user-text:#fff;
    --input-bg:#1e1e2f;
    --input-border:#2a2a45;
    --placeholder:#7a7a9a;
    --chip-bg:#1e1e2f;
    --chip-border:#2a2a45;
    --chip-text:#e8e8f0;
    --typing-bg:#4a4a6a;
    --shadow:0 2px 12px rgba(0,0,0,0.4);
    --menu-ahl-bg:#0d2818;--menu-ahl-text:#2ecc71;
    --menu-dpr-bg:#2a0a0a;--menu-dpr-text:#ff4757;
    --menu-ohd-bg:#2a1a00;--menu-ohd-text:#ffa502;
    --menu-rush-bg:#0a1a2a;--menu-rush-text:#1e90ff;
    --menu-afkl-bg:#1a0a2a;--menu-afkl-text:#a55eea;
    --menu-mx-bg:#2a1a0a;--menu-mx-text:#ff9f43;
    --menu-system-bg:#1a1a2e;--menu-system-text:#a0a0b8;
    --menu-general-bg:#1e1e2f;--menu-general-text:#a0a0b8;
    --menu-codes-bg:#1e1e2f;--menu-codes-text:#e8e8f0;
    --accent:#ff6b6b;
    --accent-hover:#ff8e53;
    --divider:#2a2a45;
    --scroll-thumb:#4a4a6a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--text);background:var(--bg);transition:background .2s,color .2s}
  .app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;background:var(--bg)}

  header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--header-bg);border-bottom:1px solid var(--header-border);transition:background .2s,border-color .2s}
  .header-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .header-title .dot{width:8px;height:8px;border-radius:50%;background:#3fb950;display:inline-block}
  .theme-btn{background:transparent;border:none;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px}
  .theme-btn:active{background:rgba(0,0,0,0.05)}
  .dark .theme-btn:active{background:rgba(255,255,255,0.08)}
  .new-chat-btn{background:transparent;border:none;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;color:var(--text);opacity:.7}
  .new-chat-btn:active{opacity:1;background:rgba(0,0,0,0.05)}
  .dark .new-chat-btn:active{background:rgba(255,255,255,0.08)}

  .quick-bar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--header-bg);border-bottom:1px solid var(--header-border);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .quick-bar::-webkit-scrollbar{display:none}
  .quick-label{font-size:11px;font-weight:700;color:var(--placeholder);text-transform:uppercase;letter-spacing:0.03em;margin-right:4px;flex-shrink:0}
  .quick-chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid transparent;flex-shrink:0;transition:transform .1s}
  .quick-chip:active{transform:scale(0.95)}
  .quick-chip.ahl{background:var(--menu-ahl-bg);color:var(--menu-ahl-text);border-color:rgba(0,0,0,0.06)}
  .quick-chip.dpr{background:var(--menu-dpr-bg);color:var(--menu-dpr-text);border-color:rgba(0,0,0,0.06)}
  .quick-chip.ohd{background:var(--menu-ohd-bg);color:var(--menu-ohd-text);border-color:rgba(0,0,0,0.06)}
  .quick-chip.rush{background:var(--menu-rush-bg);color:var(--menu-rush-text);border-color:rgba(0,0,0,0.06)}
  .quick-chip.general{background:var(--menu-general-bg);color:var(--menu-general-text);border-color:rgba(0,0,0,0.06)}

  .chat{flex:1;overflow-y:auto;padding:12px 14px 80px 14px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:5px}
  .chat::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:4px}

  .message{display:flex;margin-bottom:10px;animation:msgIn .25s ease-out;align-items:flex-end}
  .message.bot{justify-content:flex-start;gap:8px}
  .message.user{justify-content:flex-end}
  .avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--header-border);background:#000}
  .dark .avatar{border-color:#333}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .bubble{max-width:85%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap;box-shadow:var(--shadow)}
  .bot .bubble{background:var(--bubble-bot-bg);color:var(--bubble-bot-text);border:1px solid var(--bubble-bot-border);border-bottom-left-radius:4px}
  .user .bubble{background:var(--bubble-user-bg);color:var(--bubble-user-text);border-bottom-right-radius:4px}

  .bubble strong{color:inherit;font-weight:700}
  .bubble p{margin-bottom:6px}
  .bubble p:last-child{margin-bottom:0}
  .bubble ol,.bubble ul{margin:6px 0 6px 18px}
  .bubble li{margin-bottom:3px}
  .bubble .emoji{font-size:1.15em;vertical-align:-2px;margin-right:3px}

  .button-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .menu-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 8px;border-radius:14px;border:1px solid transparent;font-size:13px;font-weight:700;cursor:pointer;min-height:72px;transition:transform .1s,filter .1s;text-align:center;line-height:1.3}
  .menu-btn:active{transform:scale(0.97)}
  .menu-btn .icon{font-size:22px;line-height:1}
  .menu-btn.ahl{background:var(--menu-ahl-bg);color:var(--menu-ahl-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.dpr{background:var(--menu-dpr-bg);color:var(--menu-dpr-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.ohd{background:var(--menu-ohd-bg);color:var(--menu-ohd-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.rush{background:var(--menu-rush-bg);color:var(--menu-rush-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.afkl{background:var(--menu-afkl-bg);color:var(--menu-afkl-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.mx{background:var(--menu-mx-bg);color:var(--menu-mx-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.system{background:var(--menu-system-bg);color:var(--menu-system-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.general{background:var(--menu-general-bg);color:var(--menu-general-text);border-color:rgba(0,0,0,0.06)}
  .menu-btn.codes{background:var(--menu-codes-bg);color:var(--menu-codes-text);border:1px solid var(--divider)}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--chip-border);background:var(--chip-bg);color:var(--chip-text);transition:transform .1s}
  .chip:active{transform:scale(0.95)}
  .chip.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  .typing{display:flex;align-items:center;gap:4px;padding:12px 14px;border-radius:18px;background:var(--bubble-bot-bg);border:1px solid var(--bubble-bot-border);width:52px;border-bottom-left-radius:4px}
  .typing span{display:block;width:7px;height:7px;border-radius:50%;background:var(--typing-bg);animation:typingBounce 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes typingBounce{0%,80%,100%{transform:scale(0.6);opacity:.4}40%{transform:scale(1);opacity:1}}

  .input-area{position:fixed;bottom:0;left:0;right:0;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--header-bg);border-top:1px solid var(--header-border);display:flex;gap:8px;align-items:center;max-width:600px;margin:0 auto;transition:background .2s,border-color .2s}
  .input-area input{flex:1;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:20px;padding:10px 16px;font-size:16px;outline:none;-webkit-appearance:none}
  .input-area input::placeholder{color:var(--placeholder)}
  .input-area input:focus{border-color:var(--accent)}
  .input-area button.send{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .input-area button.send:active{background:var(--accent-hover);transform:scale(0.95)}

  .expand-btn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--divider);background:transparent;color:var(--text);opacity:.8}
  .expand-btn:active{opacity:1;background:rgba(0,0,0,0.03)}
  .dark .expand-btn:active{background:rgba(255,255,255,0.05)}

  .ref-box{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px dashed var(--divider);font-size:13px;line-height:1.5;background:rgba(0,0,0,0.02)}
  .dark .ref-box{background:rgba(255,255,255,0.02)}
  .ref-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--placeholder);margin-bottom:4px}

  .ops-box{margin-top:10px;padding:12px 14px;border-radius:12px;border:2px solid #ff9800;font-size:13px;line-height:1.6;background:rgba(255,152,0,0.08);color:var(--text)}
  .dark .ops-box{background:rgba(255,152,0,0.12);border-color:#ff9800}
  .ops-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#e65100;margin-bottom:6px}
  .dark .ops-label{color:#ff9800}

  .glossary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .gloss-btn{display:flex;align-items:center;justify-content:center;padding:10px 4px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--divider);background:var(--chip-bg);color:var(--chip-text);min-height:44px}
  .gloss-btn:active{transform:scale(0.95)}

  .section-title{font-weight:700;margin-bottom:6px;font-size:15px}
  .step-list{margin:8px 0 8px 0;padding:0;list-style:none}
  .step-list li{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
  .step-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}

  @media(min-width:640px){
    .app{border-left:1px solid var(--header-border);border-right:1px solid var(--header-border)}
    .button-grid{grid-template-columns:repeat(3,1fr)}
    .glossary-grid{grid-template-columns:repeat(6,1fr)}
  }
</style>
</head>

}

function expand(tokens){
  const out=new Set();
  for(const t of tokens){
    if(!t||STOP.has(t)) continue;
    out.add(t);
    const pool=[t];
    if(INF[t]) pool.push(INF[t]);
    for(const w of pool){
      for(const [k,vals] of Object.entries(SYN)){
        if(vals.includes(w)||vals.includes(INF[w]||'')){ out.add(canon(k)); }
      }
    }
  }
  return out;
}

function makeExpandedSet(arr){
  const s=new Set(arr.map(canon).filter(Boolean));
  for(const k of [...s]){
    for(const [key,vals] of Object.entries(SYN)){
      const ckey=canon(key);
      if(ckey===k||vals.includes(k)||vals.includes(INF[k]||'')){
        s.add(ckey);
        vals.forEach(v=>s.add(canon(v)));
      }
    }
  }
  return s;
}

function scoreChunk(chunk,tokens){
  const kw=chunk.expandedKeywords;
  const matched=[...tokens].filter(x=>kw.has(x));
  const base=kw.size? matched.length/Math.min(kw.size,tokens.size||1):0;
  let bonus=0;
  if(chunk.expandedCritical&&chunk.expandedCritical.size){
    const crit=chunk.expandedCritical;
    const cm=[...tokens].filter(x=>crit.has(x));
    bonus=(cm.length/Math.min(crit.size,tokens.size||1))*0.5;
  }
  return base+bonus;
}

    steps_full:'MÉXICO - ADUANA AICM (AGENCIA NACIONAL DE ADUANAS):\n\nAsunto: salida de equipajes, sobrevolados o sobrantes de aerolíneas.\n\nDocumento requerido:\n- Carta de la Agencia Nacional de Aduanas de México, Aduana del Aeropuerto Internacional de la Ciudad de México (AICM).\n- Se requiere cuando el equipaje no se presentó al pasajero por: demora de la aerolínea, olvido, abandono del pasajero, o envío posterior por falta de capacidad en el vuelo correspondiente.\n\nCampos del formato:\n- N° de maletas\n- N° de etiqueta\n- Nombre del pasajero\n- Origen\n- Destino\n- Color\n- Motivo real\n- Descripción de la mercancía\n\nOpciones de motivo:\n1. Enviar al domicilio\n2. Equipaje Sobrevolado\n3. Rechazo\n4. Conexión Internacional\n5. Entrega en mostrador\n\nProcedimiento:\n- El representante de la aerolínea presenta el equipaje ante la autoridad aduanera para solicitar la autorización de salida.\n- Se somete a revisión mediante equipo no intrusivo (rayos X) y/o revisión física.\n- Si no se detecta mercancía excedente a la franquicia ni mercancía sujeta a regulaciones/restricciones no arancelarias, se autoriza el retiro.\n\nFirmas requeridas en el documento:\n- Representante de la aerolínea (Nombre + No. Folio TIA)\n- Jefe o responsable de sala que autoriza (Nombre + Constancia de Id)\n- Personal de aduana que realiza la revisión física (Nombre + Constancia de Id)\n\nFuente: wt_propio.pdf (formato Aduana AICM)',

/* ===================== PRECOMPUTE ===================== */

for(const c of KB){
  const kw=[...c.keywords];
  if(c.extra_note) kw.push(...c.extra_note.split(/[\s\n.,;!?():\-]+/));
  c.expandedKeywords=makeExpandedSet(kw);
  c.expandedCritical=c.critical?makeExpandedSet(c.critical):new Set();
}
for(const g of GLOSSARY){
  g.expandedKeywords=makeExpandedSet(g.keywords);
  g.expandedCritical=g.critical?makeExpandedSet(g.critical):new Set();
}

const ALL_TERMS=['AHL','DPR','OHD','Rush','FWD','DMG','PIL','Login','Mascarilla','Green Screen','CAH','CDP','COH','QOH','BDO','SHC','ROH','SUS','RIT','RAW','RCB','RIB','XTR','CFD','CFI','DAH','DOH','DDP','DFW','TNT','CT','FD','RT','TN','NM','IT','PT','PA','PN','TA','TP','CP','RL','FS','AG','CC','BI','BR','DV','TK','FX','AB','BP','AF','KL','Altea','Amadeus','Aduana','AICM'];
let msgIdCounter=0;

/* ===================== CHAT ENGINE ===================== */

const chat=document.getElementById('chat');
const qEl=document.getElementById('q');
const btn=document.getElementById('btn');
const themeToggle=document.getElementById('themeToggle');
const clearBtn=document.getElementById('clearBtn');
const themeColor=document.getElementById('themeColor');

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function scrollToBottom(){chat.scrollTop=chat.scrollHeight;}

function clearChat(){
  chat.innerHTML='';
  try{localStorage.removeItem('wt_helper_v6');}catch(e){}
  msgIdCounter++;
  showHomeMenu();
}

function addMessage(text,sender){
  const div=document.createElement('div');
  div.className='message '+sender;
  if(sender==='bot'){
    const img=document.createElement('img');
    img.src='wt/avatar.png';
    img.className='avatar';
    img.alt='AF-KL';
    img.onerror=function(){this.style.display='none';};
    div.appendChild(img);
  }
  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.innerHTML=text;
  div.appendChild(bubble);
  chat.appendChild(div);
  scrollToBottom();
  saveHistory();
  return bubble;
}

function showTyping(){
  const div=document.createElement('div');
  div.className='message bot typing-msg';
  div.innerHTML='<div class="bubble typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  scrollToBottom();
  return div;
}
function hideTyping(el){if(el&&el.parentNode)el.parentNode.removeChild(el);}

function botReply(text,buttons, delay=300){
  const t=showTyping();
  setTimeout(()=>{
    hideTyping(t);
    const bubble=addMessage(text,'bot');
    if(buttons&&buttons.length) renderButtons(buttons,bubble);
    saveHistory();
  },delay);
}

function renderButtons(buttons,intoBubble){
  const row=document.createElement('div');
  row.className='chip-row';
  for(const b of buttons){
    const btn=document.createElement('button');
    btn.className='chip'+(b.primary?' primary':'');
    btn.textContent=b.label;
    btn.dataset.action=b.action;
    if(b.action==='kb_item'&&b.data) btn.dataset.kbId=b.data.id;
    if(b.action==='glossary_item'&&b.data) btn.dataset.glossaryId=b.data.id;
    if(b.action==='menu'){
      if(b.menuGroup) btn.dataset.menuGroup=b.menuGroup;
      if(b.menuType) btn.dataset.menuType=b.menuType;
      if(b.replyText) btn.dataset.replyText=b.replyText;
    }
    row.appendChild(btn);
  }
  intoBubble.appendChild(row);
}

function renderMenuGrid(buttons,intoBubble){
  const grid=document.createElement('div');
  grid.className='button-grid';
  for(const b of buttons){
    const btn=document.createElement('button');
    btn.className='menu-btn '+(b.style||'');
    btn.innerHTML='<span class="icon">'+(b.icon||'')+'</span><span>'+escapeHtml(b.label)+'</span>';
    btn.dataset.action=b.action;
    if(b.action==='kb_item'&&b.data) btn.dataset.kbId=b.data.id;
    if(b.action==='glossary_item'&&b.data) btn.dataset.glossaryId=b.data.id;
    if(b.action==='menu'){
      if(b.menuGroup) btn.dataset.menuGroup=b.menuGroup;
      if(b.menuType) btn.dataset.menuType=b.menuType;
      if(b.replyText) btn.dataset.replyText=b.replyText;
    }
    grid.appendChild(btn);
  }
  intoBubble.appendChild(grid);
}

function renderGlossaryGrid(intoBubble){
  const grid=document.createElement('div');
  grid.className='glossary-grid';
  for(const g of GLOSSARY){
    const btn=document.createElement('button');
    btn.className='gloss-btn';
    btn.textContent=g.term;
    btn.dataset.action='glossary_item';
    btn.dataset.glossaryId=g.id;
    grid.appendChild(btn);
  }
  intoBubble.appendChild(grid);
}

function userMessage(text){
  addMessage(escapeHtml(text),'user');
}

/* ===================== EVENT DELEGATION ===================== */

function handleChatClick(e){
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const action=btn.dataset.action;

  if(action==='expand'){
    const type=btn.dataset.expandType;
    const id=btn.dataset.expandId;
    const box=document.getElementById(type+'-'+id);
    if(box){box.style.display='block';btn.style.display='none';scrollToBottom();saveHistory();}
    return;
  }

  if(action==='kb_item'){
    const id=btn.dataset.kbId;
    const item=KB.find(k=>k.id===id);
    if(!item) return;
    userMessage(btn.textContent);
    showKbItem(item);
    return;
  }

  if(action==='glossary_item'){
    const id=btn.dataset.glossaryId;
    const item=GLOSSARY.find(g=>g.id===id);
    if(!item) return;
    userMessage(btn.textContent);
    showGlossaryItem(item);
    return;
  }

  if(action==='menu'){
    const group=btn.dataset.menuGroup;
    const type=btn.dataset.menuType;
    const replyText=btn.dataset.replyText||('📂 '+btn.textContent+' — ¿Qué necesitas?');
    let children;
    if(group) children=buildMenuChildren(group);
    else if(type==='extras') children=buildMenuChildren('general').concat(buildMenuChildren('codes')).slice(0,8).concat([{label:'↩️ Inicio',action:'home'}]);
    else if(type==='glossary') children=glossaryMenuChildren();
    userMessage(btn.textContent);
    botReply(replyText,children);
    return;
  }

  if(action==='home'){
    userMessage('Inicio');
    showHomeMenu();
    return;
  }
}

function showKbItem(item){
  const uid=item.id+'-'+(++msgIdCounter);
  let html='<div class="section-title">'+escapeHtml(item.title)+'</div>';
  html+='<p><strong>'+escapeHtml(item.summary)+'</strong></p>';
  if(item.steps_short&&item.steps_short.length){
    html+='<ol class="step-list">';
    for(let i=0;i<item.steps_short.length;i++){
      html+='<li><span class="step-num">'+(i+1)+'</span><span>'+escapeHtml(item.steps_short[i])+'</span></li>';
    }
    html+='</ol>';
  }
  const hasFull=item.steps_full&&item.steps_full.length>item.summary.length+50;
  const hasRef=item.reference_en&&item.reference_en.length>10;
  const hasExtra=item.extra_note&&item.extra_note.length>10;
  if(hasFull){
    html+='<button class="expand-btn" data-action="expand" data-expand-type="full" data-expand-id="'+uid+'">Ver más 🔽</button>';
    html+='<div id="full-'+uid+'" style="display:none;margin-top:8px;"><div style="white-space:pre-wrap;font-size:13px;line-height:1.5;">'+escapeHtml(item.steps_full)+'</div></div>';
  }
  if(hasRef){
    html+='<button class="expand-btn" data-action="expand" data-expand-type="ref" data-expand-id="'+uid+'">🇬🇧 Ver referencia del manual</button>';
    html+='<div id="ref-'+uid+'" style="display:none;margin-top:8px;"><div class="ref-box"><div class="ref-label">Manual reference</div><div style="white-space:pre-wrap;">'+escapeHtml(item.reference_en)+'</div></div></div>';
  }
  if(hasExtra){
    html+='<div class="ops-box"><div class="ops-label">Información operativa</div><div style="white-space:pre-wrap;">'+escapeHtml(item.extra_note)+'</div></div>';
  }
  const related=getRelated(item);
  botReply(html,related,250);
}

function showGlossaryItem(item){
  const uid=item.id+'-'+(++msgIdCounter);
  let html='<div class="section-title">'+escapeHtml(item.title)+'</div>';
  html+='<p><strong>🇲🇽 '+escapeHtml(item.summary)+'</strong></p>';
  if(item.example) html+='<p style="font-size:13px;opacity:.85;"><strong>Ejemplo:</strong> <code>'+escapeHtml(item.example)+'</code></p>';
  html+='<button class="expand-btn" data-action="expand" data-expand-type="ref-g" data-expand-id="'+uid+'">🇬🇧 Ver referencia del manual</button>';
  html+='<div id="ref-g-'+uid+'" style="display:none;margin-top:8px;"><div class="ref-box"><div class="ref-label">Manual reference</div><div style="white-space:pre-wrap;">'+escapeHtml(item.en)+'</div></div></div>';
  botReply(html,[{label:'↩️ Otro término',action:'home'},{label:'📖 Glosario',action:'menu',replyText:'📖 Elige un elemento:',menuType:'glossary'}],250);
}

function getRelated(item){
  const sameGroup=KB.filter(k=>k.group===item.group&&k.id!==item.id);
  const btns=sameGroup.slice(0,3).map(k=>({label:k.title,action:'kb_item',data:k}));
  const afklMap={'ahl':'afkl_ahl_altea','dpr':'afkl_dpr_foh_fwd_bdo','ohd':'afkl_modificar_buscar','rush':'afkl_dpr_foh_fwd_bdo','bdo':'afkl_dpr_foh_fwd_bdo'};
  if(afklMap[item.group]){
    const afkl=KB.find(k=>k.id===afklMap[item.group]);
    if(afkl) btns.push({label:'✈️ AF/KL: '+afkl.title,action:'kb_item',data:afkl});
  }
  btns.push({label:'↩️ Inicio',action:'home'});
  return btns;
}

function buildMenuChildren(group,icon,style){
  return KB.filter(k=>k.group===group).map(k=>({label:k.title,action:'kb_item',data:k}));
}

function glossaryMenuChildren(){
  return GLOSSARY.map(g=>({label:g.term,action:'glossary_item',data:g}));
}

function showHomeMenu(){
  const html='<strong>“Bienvenido a bordo. Todo parece estar bajo control.”</strong><br><br>Conectado a AF-KL World Tracer. Manteniendo el flujo operativo un incidente a la vez. Procedimientos disponibles. Paciencia recomendada.';

  renderMenuGrid([

/* ===================== SEARCH (free text) ===================== */

function detectGlossaryIntent(query){
  const q=canon(query);
  if(/^(que_significa|que_es|definicion_de|significado_de|para_que_sirve|como_se_usa|donde_va|donde_pongo|elemento|campo)/.test(q)) return true;
  const trimmed=query.trim();
  if(/^[A-Z]{2,4}\d{0,2}$/i.test(trimmed)&&trimmed.length<=6) return true;
  return false;
}

function searchProcedure(tokens){
  let best=null,bestScore=-1;
  for(const c of KB){ const s=scoreChunk(c,tokens); if(s>bestScore){bestScore=s;best=c;} }
  if(bestScore<0.25) return null;
  return best;
}
function searchGlossary(tokens){
  let best=null,bestScore=-1;
  for(const g of GLOSSARY){ const s=scoreChunk(g,tokens); if(s>bestScore){bestScore=s;best=g;} }
  if(bestScore<0.20) return null;
  return best;
}

function handleFileNumber(query){
  const match=query.match(/\b(MEXAF\d{4,6}|MEXKL\d{4,6})\b/i);
  if(!match) return false;
  const num=match[1].toUpperCase();
  const airline=num.startsWith('MEXAF')?'Air France (AF)':'KLM (KL)';
  const q=query.toUpperCase();
  const typeAhl=/\bAHL\b/.test(q);
  const typeOhd=/\bOHD\b/.test(q);
  const typeDpr=/\bDPR\b/.test(q);
  const typeFwd=/\bFWD\b/.test(q)||/\bRUSH\b/.test(q);

  let html='<div class="section-title">📂 Archivo detectado: '+num+'</div>'+
    '<p><strong>'+airline+'</strong></p>';

  if(typeAhl){
    html+='<p>Abrir AHL (maleta perdida):</p><ol class="step-list"><li><span class="step-num">1</span><span><strong>WM DAH '+num+'</strong></span></li></ol>';
  }else if(typeOhd){
    html+='<p>Abrir OHD (maleta sobrante):</p><ol class="step-list"><li><span class="step-num">1</span><span><strong>WM DOH '+num+'</strong></span></li></ol>';
  }else if(typeDpr){
    html+='<p>Abrir DPR (daño/hurto):</p><ol class="step-list"><li><span class="step-num">1</span><span><strong>WM DDP '+num+'</strong></span></li></ol>';
  }else if(typeFwd){
    html+='<p>Abrir FWD (rush):</p><ol class="step-list"><li><span class="step-num">1</span><span><strong>WM DFW '+num+'</strong></span></li></ol>';
  }else{
    html+='<p>Comandos para abrir este archivo según el tipo de expediente:</p>'+
      '<ol class="step-list">'+
      '<li><span class="step-num">1</span><span>AHL (perdida): <strong>WM DAH '+num+'</strong></span></li>'+
      '<li><span class="step-num">2</span><span>OHD (sobrante): <strong>WM DOH '+num+'</strong></span></li>'+
      '<li><span class="step-num">3</span><span>DPR (daño/hurto): <strong>WM DDP '+num+'</strong></span></li>'+
      '<li><span class="step-num">4</span><span>FWD (rush): <strong>WM DFW '+num+'</strong></span></li>'+
      '</ol>';
  }
  html+='<p style="font-size:13px;opacity:.85;margin-top:8px;">Si el archivo está inactivo (más de 100 días): <strong>WM PDI AHL '+num+' DT + MES/AÑO</strong></p>';
  botReply(html,[{label:'↩️ Inicio',action:'home'}],250);
  return true;
}

function handleFreeText(query){
  if(handleFileNumber(query)) return;
  const raw=query.split(/[\s\/.,;!?():\-]+/).map(canon).filter(Boolean);
  const tokens=expand(raw);
  if(tokens.size===0){
    botReply('No entendí bien. ¿Puedes intentar con otras palabras o tocar un botón de arriba? 👆',[{label:'↩️ Inicio',action:'home'}]);
    return;
  }
  const isGloss=detectGlossaryIntent(query);
  let result=null;
  if(isGloss){ result=searchGlossary(tokens); if(!result) result=searchProcedure(tokens); }
  else { result=searchProcedure(tokens); if(!result) result=searchGlossary(tokens); }
  if(!result){
    const suggs=[];
    for(const t of tokens){
      if(SYN['maleta']&&SYN['maleta'].includes(t)) suggs.push({label:'🟢 AHL',action:'menu',replyText:'🟢 AHL — Maleta perdida. ¿Qué necesitas?',menuGroup:'ahl'});
      if(SYN['perdida']&&SYN['perdida'].includes(t)) suggs.push({label:'🟢 AHL',action:'menu',replyText:'🟢 AHL — Maleta perdida. ¿Qué necesitas?',menuGroup:'ahl'});
      if(SYN['danada']&&SYN['danada'].includes(t)) suggs.push({label:'🔴 DPR',action:'menu',replyText:'🔴 DPR — Daño o hurto. ¿Qué necesitas?',menuGroup:'dpr'});
      if(SYN['robo']&&SYN['robo'].includes(t)) suggs.push({label:'🔴 DPR',action:'menu',replyText:'🔴 DPR — Daño o hurto. ¿Qué necesitas?',menuGroup:'dpr'});
      if(SYN['onhand']&&SYN['onhand'].includes(t)) suggs.push({label:'🟠 OHD',action:'menu',replyText:'🟠 OHD — Maleta sobrante. ¿Qué necesitas?',menuGroup:'ohd'});
      if(SYN['rush']&&SYN['rush'].includes(t)) suggs.push({label:'🔵 Rush',action:'menu',replyText:'🔵 Rush / FWD — Reenvío. ¿Qué necesitas?',menuGroup:'rush'});
    }
    const unique=[];
    const seen=new Set();
    for(const s of suggs){ if(!seen.has(s.label)){seen.add(s.label);unique.push(s);} }
    botReply('No encontré eso exacto. ¿Quizás buscabas?',unique.slice(0,3).concat([{label:'↩️ Inicio',action:'home'}]));
    return;
  }
  if(GLOSSARY.includes(result)){ showGlossaryItem(result); }
  else { showKbItem(result); }
}

/* ===================== HISTORY & THEME ===================== */

function saveHistory(){
  try{
    const msgs=[];
    chat.querySelectorAll('.message').forEach(m=>{
      const bubble=m.querySelector('.bubble');
      if(!bubble) return;
      msgs.push({sender:m.classList.contains('bot')?'bot':'user',html:bubble.innerHTML});
    });
    localStorage.setItem('wt_helper_v6',JSON.stringify(msgs.slice(-30)));
  }catch(e){}
}

function loadHistory(){
  try{
    const raw=localStorage.getItem('wt_helper_v6');
    if(!raw) return false;
    const msgs=JSON.parse(raw);
    for(const m of msgs){
      const div=document.createElement('div');
      div.className='message '+m.sender;
      const bubble=document.createElement('div');
      bubble.className='bubble';
      bubble.innerHTML=m.html;
      div.appendChild(bubble);
      chat.appendChild(div);
    }
    scrollToBottom();
    return true;
  }catch(e){return false;}
}

function setTheme(dark){
  document.documentElement.classList.toggle('dark',dark);
  themeToggle.textContent=dark?'☀️':'🌙';
  themeColor.setAttribute('content',dark?'#0d1117':'#ffffff');
  try{localStorage.setItem('wt_helper_dark',dark?'1':'0');}catch(e){}
}

themeToggle.addEventListener('click',()=>setTheme(!document.documentElement.classList.contains('dark')));
if(localStorage.getItem('wt_helper_dark')==='1') setTheme(true);

/* ===================== EVENTS ===================== */

btn.addEventListener('click',()=>{
  const v=qEl.value.trim();
  if(!v) return;
  qEl.value='';
  userMessage(v);
  handleFreeText(v);
});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();btn.click();}});

clearBtn.addEventListener('click',clearChat);

chat.addEventListener('click',handleChatClick);
document.getElementById('quickBar').addEventListener('click',handleChatClick);

/* ===================== QUICK BAR ===================== */

function renderQuickBar(){
  const bar=document.getElementById('quickBar');
  if(!bar) return;
  bar.innerHTML='<span class="quick-label">🔥</span>';
  const items=[
    {label:'AHL',style:'ahl',action:'menu',replyText:'🟢 AHL — Maleta perdida. ¿Qué necesitas?',menuGroup:'ahl'},
    {label:'BDO',style:'rush',action:'menu',replyText:'📦 BDO — Orden de entrega. ¿Qué necesitas?',menuGroup:'rush'},
    {label:'FWD',style:'rush',action:'menu',replyText:'🔵 Rush / FWD — Reenvío. ¿Qué necesitas?',menuGroup:'rush'},
    {label:'Glosario',style:'general',action:'menu',replyText:'📖 Elige un elemento:',menuType:'glossary'}
  ];
  for(const it of items){
    const chip=document.createElement('span');
    chip.className='quick-chip '+it.style;
    chip.textContent=it.label;
    chip.dataset.action=it.action;
    if(it.menuGroup) chip.dataset.menuGroup=it.menuGroup;
    if(it.menuType) chip.dataset.menuType=it.menuType;
    if(it.replyText) chip.dataset.replyText=it.replyText;
    bar.appendChild(chip);
  }
}

/* ===================== INIT ===================== */

renderQuickBar();
if(!loadHistory()){
  showHomeMenu();
}

})();
</script>
